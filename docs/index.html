<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raffel Docs</title>
  <meta name="description" content="Raffel documentation for the multi-protocol server runtime.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%238b5cf6'>R</text></svg>">
  <style>
    :root {
      color-scheme: dark light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(720px, 100%);
    }
    h1 {
      font-size: clamp(32px, 8vw, 56px);
      line-height: 1;
      margin: 0 0 16px;
      letter-spacing: 0;
    }
    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.7;
      margin: 0 0 24px;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    a {
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      padding: 10px 14px;
      text-decoration: none;
      background: rgba(139, 92, 246, 0.18);
    }
    a:hover {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(139, 92, 246, 0.3);
    }
  </style>
</head>
<body>
  <main>
    <h1>Raffel Docs</h1>
    <p>
      Raffel now ships its own documentation UI for generated USD/OpenAPI reference and file-backed Markdown guides.
      Use the links below to open the source documentation files or run a Raffel docs server for the full interactive UI.
    </p>
    <nav aria-label="Documentation links">
      <a href="./README.md">Start</a>
      <a href="./tooling/docs-ui.md">Docs UI</a>
      <a href="./tooling/docs-ui-parity.md">Docs UI Readiness</a>
      <a href="./_sidebar.md">Navigation</a>
    </nav>
  </main>
</body>
</html>
